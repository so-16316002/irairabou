<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>激難アクション - 弾幕地獄編</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
        }
        canvas {
            background-color: #222;
            border: 4px solid #fff;
            display: block;
            margin: 10px auto;
        }
        .info {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>激難アクション - 弾幕地獄編</h1>
    <p>青い弾を避けて緑のゴールを目指せ！</p>
    <div class="info">
        STAGE: <span id="stageNum">1</span> / 3 | 
        ミス回数: <span id="deathCount">0</span>
    </div>

    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const deathCountElement = document.getElementById("deathCount");
        const stageNumElement = document.getElementById("stageNum");

        let deaths = 0;
        let currentStage = 1;
        let frameCount = 0;

        // プレイヤー
        const player = {
            x: 40,
            y: 185,
            size: 12, // 弾幕回避のため当たり判定を小さめ（12px）に設定
            speed: 3
        };

        // 安全地帯・ゴール領域
        let startZone = { x: 0, y: 150, width: 80, height: 100 };
        let goalZone = { x: 620, y: 150, width: 80, height: 100 };

        let enemies = [];

        // ステージ構造の設定
        function loadStage(stage) {
            currentStage = stage;
            stageNumElement.textContent = currentStage;
            player.x = 40;
            player.y = 185;
            enemies = [];

            if (stage === 1) {
                // STAGE 1: 高速縦往復
                startZone = { x: 0, y: 150, width: 80, height: 100 };
                goalZone = { x: 620, y: 150, width: 80, height: 100 };
                
                for (let i = 0; i < 7; i++) {
                    enemies.push({
                        x: 120 + i * 70,
                        y: i % 2 === 0 ? 20 : 380,
                        radius: 8,
                        speedX: 0,
                        speedY: (i % 2 === 0 ? 1 : -1) * (7 + i * 0.5),
                        type: "bounce"
                    });
                }
            } else if (stage === 2) {
                // STAGE 2: 旋回＆挟み込み
                startZone = { x: 0, y: 0, width: 80, height: 80 };
                goalZone = { x: 620, y: 320, width: 80, height: 80 };

                // 円形回転パターン
                const centerX = 350, centerY = 200, radius = 100;
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 / 8) * i;
                    enemies.push({
                        cx: centerX, cy: centerY, r: radius, angle: angle,
                        x: centerX + Math.cos(angle) * radius,
                        y: centerY + Math.sin(angle) * radius,
                        radius: 8, speedAngle: 0.05, type: "rotate"
                    });
                }

                // 左右挟み込み
                enemies.push({ x: 100, y: 100, radius: 10, speedX: 5, speedY: 0, minX: 100, maxX: 600, type: "bounceRange" });
                enemies.push({ x: 600, y: 300, radius: 10, speedX: -5, speedY: 0, minX: 100, maxX: 600, type: "bounceRange" });
            } else if (stage === 3) {
                // STAGE 3: 怒首領蜂最大往生風 弾幕地獄
                startZone = { x: 0, y: 150, width: 70, height: 100 };
                goalZone = { x: 630, y: 150, width: 70, height: 100 };

                // 固定の高速針弾レーン
                for (let i = 0; i < 5; i++) {
                    enemies.push({
                        x: 180 + i * 80,
                        y: (i % 2 === 0 ? 20 : 380),
                        radius: 6,
                        speedX: 0,
                        speedY: (i % 2 === 0 ? 10 : -10),
                        type: "bounce"
                    });
                }
            }
        }
        function loadStage(stage) {
    clearKeys(); // ← 追加：ステージ切り替え時にキー入力を一度リセットする

    currentStage = stage;
    stageNumElement.textContent = currentStage;
    player.x = 40;
    player.y = 185;
    enemies = [];
    
    // ...以下そのまま
       function clearKeys() {
       for (let key in keys) {
       keys[key] = false;
     }
 }
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function resetPlayer() {
            player.x = startZone.x + 20;
            player.y = startZone.y + startZone.height / 2 - player.size / 2;
        }

        function update() {
            frameCount++;

            // 操作
            if ((keys["ArrowUp"] || keys["w"]) && player.y > 0) player.y -= player.speed;
            if ((keys["ArrowDown"] || keys["s"]) && player.y + player.size < canvas.height) player.y += player.speed;
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || keys["d"]) && player.x + player.size < canvas.width) player.x += player.speed;

            // STAGE 3 動的弾幕生成（怒首領蜂風）
            if (currentStage === 3) {
                // 一定フレームごとに全方位リング弾幕を放射（画面中央の砲台より）
                if (frameCount % 40 === 0) {
                    const bulletCount = 12;
                    for (let i = 0; i < bulletCount; i++) {
                        const angle = (Math.PI * 2 / bulletCount) * i + (frameCount * 0.05);
                        enemies.push({
                            x: 350, y: 200,
                            vx: Math.cos(angle) * 3,
                            vy: Math.sin(angle) * 3,
                            radius: 5,
                            type: "bullet"
                        });
                    }
                }

                // 上下からの高速拡散弾
                if (frameCount % 20 === 0) {
                    enemies.push({
                        x: 120 + Math.random() * 460, y: 0,
                        vx: (Math.random() - 0.5) * 2, vy: 4 + Math.random() * 3,
                        radius: 5, type: "bullet"
                    });
                    enemies.push({
                        x: 120 + Math.random() * 460, y: 400,
                        vx: (Math.random() - 0.5) * 2, vy: -(4 + Math.random() * 3),
                        radius: 5, type: "bullet"
                    });
                }
            }

            // 障害物の動き制御
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];

                if (enemy.type === "bounce") {
                    enemy.y += enemy.speedY;
                    if (enemy.y - enemy.radius < 0 || enemy.y + enemy.radius > canvas.height) {
                        enemy.speedY *= -1;
                    }
                } else if (enemy.type === "rotate") {
                    enemy.angle += enemy.speedAngle;
                    enemy.x = enemy.cx + Math.cos(enemy.angle) * enemy.r;
                    enemy.y = enemy.cy + Math.sin(enemy.angle) * enemy.r;
                } else if (enemy.type === "bounceRange") {
                    enemy.x += enemy.speedX;
                    if (enemy.x - enemy.radius < enemy.minX || enemy.x + enemy.radius > enemy.maxX) {
                        enemy.speedX *= -1;
                    }
                } else if (enemy.type === "bullet") {
                    enemy.x += enemy.vx;
                    enemy.y += enemy.vy;
                    // 画面外に出た生成弾は消去
                    if (enemy.x < 0 || enemy.x > canvas.width || enemy.y < 0 || enemy.y > canvas.height) {
                        enemies.splice(i, 1);
                        continue;
                    }
                }

                // 当たり判定
                const closestX = Math.max(player.x, Math.min(player.x + player.size, enemy.x));
                const closestY = Math.max(player.y, Math.min(player.y + player.size, enemy.y));
                if (Math.hypot(enemy.x - closestX, enemy.y - closestY) < enemy.radius) {
                    deaths++;
                    deathCountElement.textContent = deaths;
                    loadStage(currentStage); // ミス時は現在のステージをやり直し
                    return;
                }
            }

            // ゴール判定
            if (player.x + player.size > goalZone.x && 
                player.x < goalZone.x + goalZone.width &&
                player.y + player.size > goalZone.y && 
                player.y < goalZone.y + goalZone.height) {
                
                if (currentStage < 3) {
                    alert(`STAGE ${currentStage} クリア！ 次のステージへ進みます。`);
                    loadStage(currentStage + 1);
                } else {
                    alert(`全ステージクリア！おめでとうございます！\n総ミス回数: ${deaths} 回`);
                    deaths = 0;
                    deathCountElement.textContent = deaths;
                    loadStage(1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景（格子模様）
            const tileSize = 40;
            for (let r = 0; r < canvas.height / tileSize; r++) {
                for (let c = 0; c < canvas.width / tileSize; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? "#262626" : "#1e1e1e";
                    ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                }
            }

            // スタート＆ゴールエリア
            ctx.fillStyle = "#55ff55";
            ctx.fillRect(startZone.x, startZone.y, startZone.width, startZone.height);
            ctx.fillRect(goalZone.x, goalZone.y, goalZone.width, goalZone.height);

            // STAGE 3 中央砲台の演出描画
            if (currentStage === 3) {
                ctx.beginPath();
                ctx.arc(350, 200, 20, 0, Math.PI * 2);
                ctx.fillStyle = "#ff0055";
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.stroke();
            }

            // プレイヤー描画
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.strokeRect(player.x, player.y, player.size, player.size);

            // 障害物・弾幕描画
            enemies.forEach(enemy => {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fillStyle = enemy.type === "bullet" ? "#00ffff" : "#0066ff";
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loadStage(1);
        loop();
    </script>
</body>
</html>
