<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全画面・巨大イライラ棒</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff0055;
            background-color: #050508;
            cursor: crosshair;
        }
        #info {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0055;
        }
    </style>
</head>
<body>

<div id="info">DEATHS: <span id="death-count">0</span></div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathDisplay = document.getElementById('death-count');

// --- パラメータ設定 ---
const EASING = 0.045;       // 強い慣性（滑る操作感）
const PLAYER_RADIUS = 2.5;  // 自機サイズ

let mouseX = 40, mouseY = 40;
let playerX = 40, playerY = 40;
let deathCount = 0;

let gameState = 'START';

// スタート・ゴール
const startZone = {x: 15, y: 15, w: 50, h: 50};
const goalZone = {x: 15, y: 525, w: 50, h: 50};

// --- 外壁・静的コース仕切り ---
const walls = [
    // 外枠
    {x: 0, y: 0, w: 800, h: 10},
    {x: 0, y: 590, w: 800, h: 10},
    {x: 0, y: 0, w: 10, h: 600},
    {x: 790, y: 0, w: 10, h: 600},

    // 【エリア1】上部：イラスト再現コース（上下交互の突起）
    {x: 10, y: 65, w: 715, h: 5},
    // 上からの突起
    {x: 100, y: 10, w: 4, h: 32}, {x: 180, y: 10, w: 4, h: 35},
    {x: 260, y: 10, w: 4, h: 32}, {x: 340, y: 10, w: 4, h: 38},
    {x: 420, y: 10, w: 4, h: 30}, {x: 500, y: 10, w: 4, h: 35},
    {x: 580, y: 10, w: 4, h: 32}, {x: 660, y: 10, w: 4, h: 36},
    // 下からの突起
    {x: 140, y: 33, w: 4, h: 32}, {x: 220, y: 30, w: 4, h: 35},
    {x: 300, y: 33, w: 4, h: 32}, {x: 380, y: 28, w: 4, h: 37},
    {x: 460, y: 35, w: 4, h: 30}, {x: 540, y: 30, w: 4, h: 35},
    {x: 620, y: 33, w: 4, h: 32}, {x: 700, y: 28, w: 4, h: 37},

    // 【エリア2】右側：縦下降ゾーン
    {x: 725, y: 65, w: 5, h: 450},
    {x: 730, y: 150, w: 35, h: 5},
    {x: 755, y: 250, w: 35, h: 5},
    {x: 730, y: 350, w: 35, h: 5},

    // 【エリア3】中央：ジグザグ迷路ゾーン
    {x: 100, y: 515, w: 630, h: 5},
    {x: 100, y: 150, w: 550, h: 5},
    {x: 200, y: 220, w: 525, h: 5},
    {x: 100, y: 290, w: 550, h: 5},
    {x: 200, y: 360, w: 525, h: 5},
    {x: 100, y: 430, w: 550, h: 5},

    // 【エリア4】左下：最終ストレート
    {x: 80, y: 515, w: 5, h: 75}
];

// --- 動くお邪魔仕掛け ---
// 1. 往復移動する壁
const movingObstacles = [
    {x: 730, y: 430, w: 30, h: 6, vx: 0, vy: -2, minY: 370, maxY: 500},
    {x: 150, y: 155, w: 6, h: 35, vx: 3, vy: 0, minX: 110, maxX: 600},
    {x: 500, y: 225, w: 6, h: 35, vx: -4, vy: 0, minX: 210, maxX: 700},
    {x: 150, y: 295, w: 6, h: 35, vx: 2.5, vy: 0, minX: 110, maxX: 600},
    {x: 500, y: 365, w: 6, h: 35, vx: -3.5, vy: 0, minX: 210, maxX: 700},
    {x: 150, y: 435, w: 6, h: 35, vx: 4, vy: 0, minX: 110, maxX: 600}
];

// 2. 回転するプロペラ障害物
const spinners = [
    {cx: 650, cy: 185, length: 28, angle: 0, speed: 0.04},
    {cx: 150, cy: 255, length: 28, angle: 0, speed: -0.05},
    {cx: 650, cy: 325, length: 28, angle: 0, speed: 0.04},
    {cx: 150, cy: 395, length: 28, angle: 0, speed: -0.06},
    {cx: 650, cy: 465, length: 28, angle: 0, speed: 0.05}
];

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', () => {
    if (gameState === 'START') {
        if (mouseX >= startZone.x && mouseX <= startZone.x + startZone.w &&
            mouseY >= startZone.y && mouseY <= startZone.y + startZone.h) {
            gameState = 'PLAYING';
            playerX = startZone.x + startZone.w / 2;
            playerY = startZone.y + startZone.h / 2;
        }
    } else if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
        gameState = 'START';
        playerX = startZone.x + startZone.w / 2;
        playerY = startZone.y + startZone.h / 2;
    }
});

// 当たり判定：点と線分
function checkCollisionLine(px, py, radius, x1, y1, x2, y2) {
    let dx = x2 - x1;
    let dy = y2 - y1;
    let len = Math.sqrt(dx * dx + dy * dy);
    let u = ((px - x1) * dx + (py - y1) * dy) / (len * len);
    u = Math.max(0, Math.min(1, u));
    let ix = x1 + u * dx;
    let iy = y1 + u * dy;
    let dist = Math.sqrt((px - ix) * (px - ix) + (py - iy) * (py - iy));
    return dist < radius;
}

// 当たり判定：点と矩形
function checkCollisionRect(circleX, circleY, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(circleX, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circleY, rect.y + rect.h));
    let distanceX = circleX - closestX;
    let distanceY = circleY - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
}

function update() {
    if (gameState === 'PLAYING') {
        playerX += (mouseX - playerX) * EASING;
        playerY += (mouseY - playerY) * EASING;

        // 静的な壁判定
        for (let wall of walls) {
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, wall)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // 往復する壁の更新と判定
        for (let obs of movingObstacles) {
            if (obs.vx) {
                obs.x += obs.vx;
                if (obs.x < obs.minX || obs.x + obs.w > obs.maxX) obs.vx *= -1;
            }
            if (obs.vy) {
                obs.y += obs.vy;
                if (obs.y < obs.minY || obs.y + obs.h > obs.maxY) obs.vy *= -1;
            }
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, obs)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // 回転プロペラの更新と判定
        for (let sp of spinners) {
            sp.angle += sp.speed;
            let x2 = sp.cx + Math.cos(sp.angle) * sp.length;
            let y2 = sp.cy + Math.sin(sp.angle) * sp.length;
            let x1 = sp.cx - Math.cos(sp.angle) * sp.length;
            let y1 = sp.cy - Math.sin(sp.angle) * sp.length;

            if (checkCollisionLine(playerX, playerY, PLAYER_RADIUS, x1, y1, x2, y2)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // ゴール判定
        if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, goalZone)) {
            gameState = 'CLEAR';
        }
    }

    deathDisplay.textContent = deathCount;

    // --- 描画処理 ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // スタート＆ゴール
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(startZone.x, startZone.y, startZone.w, startZone.h);

    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

    // 固定壁（赤）
    ctx.fillStyle = '#ff0055';
    walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

    // 移動障害物（黄）
    ctx.fillStyle = '#ffee00';
    movingObstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));

    // 回転プロペラ（黄）
    ctx.strokeStyle = '#ffee00';
    ctx.lineWidth = 3;
    spinners.forEach(sp => {
        ctx.beginPath();
        ctx.moveTo(sp.cx - Math.cos(sp.angle) * sp.length, sp.cy - Math.sin(sp.angle) * sp.length);
        ctx.lineTo(sp.cx + Math.cos(sp.angle) * sp.length, sp.cy + Math.sin(sp.angle) * sp.length);
        ctx.stroke();
    });

    // 自機（緑）
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // UIメッセージ
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText('スタート枠をクリック', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(150, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('DEATH - クリックでやり直し', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0, 200, 100, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CLEAR! 完全制覇！', canvas.width / 2, canvas.height / 2);
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
