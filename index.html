<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地獄の極細イライラ棒</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff0055;
            background-color: #050508;
            cursor: crosshair;
        }
        #info {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0055;
        }
    </style>
</head>
<body>

<div id="info">DEATHS: <span id="death-count">0</span></div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathDisplay = document.getElementById('death-count');

// --- 鬼畜パラメータ調整 ---
const EASING = 0.035;        // 慣性を超絶強化（濡れた氷の上レベルの滑り）
const PLAYER_RADIUS = 2;    // 自機サイズ（直径4px）

let mouseX = 35, mouseY = 35;
let playerX = 35, playerY = 35;
let deathCount = 0;

let gameState = 'START';

// スタート・ゴール
const startZone = {x: 15, y: 15, w: 40, h: 40};
const goalZone = {x: 745, y: 545, w: 40, h: 40};

// 直線壁（クリア隙間が約5px〜8pxになるよう設計）
const walls = [
    // 外枠
    {x: 0, y: 0, w: 800, h: 10},
    {x: 0, y: 590, w: 800, h: 10},
    {x: 0, y: 0, w: 10, h: 600},
    {x: 790, y: 0, w: 10, h: 600},

    // 区画1: 極狭クランク (クリア幅約5px)
    {x: 10, y: 60, w: 720, h: 10},
    {x: 60, y: 10, w: 10, h: 40},

    // 折り返し1
    {x: 70, y: 78, w: 720, h: 10},
    {x: 10, y: 96, w: 720, h: 10},

    // 縦のジグザグ地帯（壁を増量）
    {x: 100, y: 115, w: 10, h: 220},
    {x: 160, y: 150, w: 10, h: 220},
    {x: 220, y: 115, w: 10, h: 220},
    {x: 280, y: 150, w: 10, h: 220},
    {x: 340, y: 115, w: 10, h: 220},
    {x: 400, y: 150, w: 10, h: 220},
    {x: 460, y: 115, w: 10, h: 220},

    // 中盤横ライン
    {x: 10, y: 380, w: 730, h: 10},
    {x: 60, y: 398, w: 730, h: 10},

    // 終盤の格子迷路
    {x: 150, y: 418, w: 10, h: 120},
    {x: 250, y: 460, w: 10, h: 120},
    {x: 350, y: 418, w: 10, h: 120},
    {x: 450, y: 460, w: 10, h: 120},
    {x: 550, y: 418, w: 10, h: 120},
    {x: 650, y: 460, w: 10, h: 120},

    {x: 10, y: 535, w: 720, h: 10}
];

// 曲線（円形）の障害物・壁
const arcWalls = [
    // 曲線コーナー（S字カーブの壁）
    {cx: 550, cy: 200, r: 40, startAngle: 0, endAngle: Math.PI * 1.5, thickness: 10},
    {cx: 650, cy: 280, r: 50, startAngle: Math.PI * 0.5, endAngle: Math.PI * 2, thickness: 10},
    {cx: 550, cy: 340, r: 35, startAngle: 0, endAngle: Math.PI, thickness: 10},

    // 終盤のドーナツ型・曲線の難所
    {cx: 710, cy: 470, r: 30, startAngle: 0, endAngle: Math.PI * 2, thickness: 8}
];

// 隙間なく大量に迫る動くお邪魔壁
const movingObstacles = [
    {x: 100, y: 69, w: 10, h: 8, vx: 5, minX: 70, maxX: 720},
    {x: 600, y: 89, w: 10, h: 6, vx: -6, minX: 10, maxX: 720},
    // ジグザグ地帯の上下運動壁
    {x: 125, y: 120, w: 20, h: 8, vy: 4, minY: 115, maxY: 370},
    {x: 185, y: 350, w: 20, h: 8, vy: -5, minY: 115, maxY: 370},
    {x: 245, y: 120, w: 20, h: 8, vy: 6, minY: 115, maxY: 370},
    {x: 305, y: 350, w: 20, h: 8, vy: -4, minY: 115, maxY: 370},
    {x: 365, y: 120, w: 20, h: 8, vy: 7, minY: 115, maxY: 370},
    {x: 425, y: 350, w: 20, h: 8, vy: -6, minY: 115, maxY: 370},
    // 高速横切り壁
    {x: 10, y: 389, w: 30, h: 8, vx: 9, minX: 10, maxX: 730},
    {x: 500, y: 546, w: 40, h: 8, vx: -8, minX: 10, maxX: 720}
];

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', () => {
    if (gameState === 'START') {
        if (mouseX >= startZone.x && mouseX <= startZone.x + startZone.w &&
            mouseY >= startZone.y && mouseY <= startZone.y + startZone.h) {
            gameState = 'PLAYING';
            playerX = startZone.x + startZone.w / 2;
            playerY = startZone.y + startZone.h / 2;
        }
    } else if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
        gameState = 'START';
        playerX = startZone.x + startZone.w / 2;
        playerY = startZone.y + startZone.h / 2;
    }
});

// 矩形と円の判定
function checkCollisionRect(circleX, circleY, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(circleX, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circleY, rect.y + rect.h));
    let distanceX = circleX - closestX;
    let distanceY = circleY - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
}

// 曲線（円弧）との判定
function checkCollisionArc(px, py, pr, arc) {
    let dx = px - arc.cx;
    let dy = py - arc.cy;
    let dist = Math.sqrt(dx * dx + dy * dy);
    
    // 半径方向の接触判定
    if (dist >= (arc.r - arc.thickness/2 - pr) && dist <= (arc.r + arc.thickness/2 + pr)) {
        let angle = Math.atan2(dy, dx);
        if (angle < 0) angle += Math.PI * 2;
        
        let start = arc.startAngle;
        let end = arc.endAngle;
        
        if (start <= end) {
            if (angle >= start && angle <= end) return true;
        } else {
            if (angle >= start || angle <= end) return true;
        }
    }
    return false;
}

function update() {
    if (gameState === 'PLAYING') {
        // 慣性を極限まで高める（超・追従遅れ）
        playerX += (mouseX - playerX) * EASING;
        playerY += (mouseY - playerY) * EASING;

        // 動く障害物の更新
        movingObstacles.forEach(obs => {
            if (obs.vy) {
                obs.y += obs.vy;
                if (obs.y < obs.minY || obs.y + obs.h > obs.maxY) obs.vy *= -1;
            }
            if (obs.vx) {
                obs.x += obs.vx;
                if (obs.x < obs.minX || obs.x + obs.w > obs.maxX) obs.vx *= -1;
            }

            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, obs)) {
                gameState = 'GAMEOVER';
                deathCount++;
            }
        });

        // 四角い壁判定
        for (let wall of walls) {
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, wall)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // 曲線壁判定
        for (let arc of arcWalls) {
            if (checkCollisionArc(playerX, playerY, PLAYER_RADIUS, arc)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // ゴール判定
        if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, goalZone)) {
            gameState = 'CLEAR';
        }
    }

    deathDisplay.textContent = deathCount;

    // 描画
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // スタート＆ゴール
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(startZone.x, startZone.y, startZone.w, startZone.h);

    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

    // 直線壁（赤）
    ctx.fillStyle = '#ff0055';
    walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

    // 曲線壁（赤）
    ctx.strokeStyle = '#ff0055';
    arcWalls.forEach(arc => {
        ctx.beginPath();
        ctx.arc(arc.cx, arc.cy, arc.r, arc.startAngle, arc.endAngle);
        ctx.lineWidth = arc.thickness;
        ctx.stroke();
    });

    // 大量のお邪魔障害物（黄）
    ctx.fillStyle = '#ffee00';
    movingObstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));

    // 自機（極小の緑点）
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // オーバーレイ
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0055';
        ctx.fillText('緑枠をクリックして絶望へ', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(150, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('即死 - クリックして再挑戦', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0, 200, 100, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('人間卒業！クリアおめでとう！', canvas.width / 2, canvas.height / 2);
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
