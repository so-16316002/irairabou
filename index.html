<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新生・イライラ棒</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff0055;
            background-color: #050508;
        }
        #info {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0055;
        }
    </style>
</head>
<body>

<div id="info">DEATHS: <span id="death-count">0</span> | [矢印キー] 移動</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathDisplay = document.getElementById('death-count');

// --- 基本設定 ---
const ZOOM = 2.0;
const PLAYER_SPEED = 2.8;
const PLAYER_RADIUS = 3.5;

let playerX = 50, playerY = 50;
let deathCount = 0;
let gameState = 'START';

const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = true;
        if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'CLEAR') {
            resetGame();
            gameState = 'PLAYING';
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
});

function resetGame() {
    playerX = 50;
    playerY = 50;
}

// スタート・ゴール
const startZone = {x: 20, y: 20, w: 60, h: 60};
const goalZone = {x: 60, y: 1540, w: 80, h: 80};

// --- 完全リニューアル外壁（1本道） ---
const walls = [
    // スタート部屋
    {x: 10, y: 10, w: 80, h: 10},
    {x: 10, y: 10, w: 10, h: 80},
    {x: 10, y: 80, w: 80, h: 10}, // スタート下を密閉

    // エリア1: イラスト再現突起ゾーン（右進）
    {x: 80, y: 10, w: 710, h: 10},
    {x: 80, y: 80, w: 630, h: 10},
    // 上下の突起（通過幅にゆとりを保持）
    {x: 160, y: 20, w: 6, h: 35}, {x: 280, y: 20, w: 6, h: 35}, {x: 400, y: 20, w: 6, h: 35}, {x: 520, y: 20, w: 6, h: 35}, {x: 640, y: 20, w: 6, h: 35},
    {x: 220, y: 35, w: 6, h: 35}, {x: 340, y: 35, w: 6, h: 35}, {x: 460, y: 35, w: 6, h: 35}, {x: 580, y: 35, w: 6, h: 35},

    // エリア2: 縦下降ゾーン1（下進）
    {x: 780, y: 10, w: 10, h: 400},
    {x: 700, y: 80, w: 10, h: 250},

    // エリア3: 横移動ゾーン（左進）
    {x: 100, y: 320, w: 610, h: 10},
    {x: 180, y: 400, w: 610, h: 10},

    // エリア4: 縦下降ゾーン2（下進）
    {x: 100, y: 320, w: 10, h: 400},
    {x: 180, y: 400, w: 10, h: 240},

    // エリア5: ロングストレート（右進）
    {x: 100, y: 710, w: 690, h: 10},
    {x: 180, y: 630, w: 530, h: 10},

    // エリア6: クランク下降（下進）
    {x: 780, y: 710, w: 10, h: 400},
    {x: 700, y: 630, w: 10, h: 400},

    // エリア7: ジグザグラストスパート（左進）
    {x: 100, y: 1100, w: 610, h: 10},
    {x: 180, y: 1020, w: 610, h: 10},

    // エリア8: ゴールエリア（下進）
    {x: 100, y: 1100, w: 10, h: 540},
    {x: 180, y: 1020, w: 10, h: 620},
    {x: 10, y: 1630, w: 180, h: 10},
    {x: 10, y: 1500, w: 10, h: 140},
    {x: 10, y: 1500, w: 90, h: 10}
];

// --- 調整済み移動障害物（詰み回避設計） ---
const movingObstacles = [
    // エリア2：可動域を制限し、退避場所を固定作成
    {x: 715, y: 150, w: 35, h: 8, vx: 2.0, vy: 0, minX: 715, maxX: 775},
    {x: 740, y: 250, w: 35, h: 8, vx: -2.0, vy: 0, minX: 715, maxX: 775},

    // エリア3：上下にスライドする障害物
    {x: 300, y: 335, w: 8, h: 35, vx: 0, vy: 1.8, minY: 335, maxY: 395},
    {x: 500, y: 335, w: 8, h: 35, vx: 0, vy: -1.8, minY: 335, maxY: 395},

    // エリア5：横ストレートを往復するバー
    {x: 250, y: 645, w: 10, h: 40, vx: 3.0, vy: 0, minX: 200, maxX: 680},

    // エリア6：下降プレスブロック
    {x: 715, y: 750, w: 60, h: 10, vx: 0, vy: 2.2, minY: 650, maxY: 1080},

    // エリア7：直前エリアの低速往復バー
    {x: 400, y: 1035, w: 10, h: 50, vx: 2.5, vy: 0, minX: 200, maxX: 680}
];

// --- 回転プロペラ（接触判定の最適化） ---
const spinners = [
    {cx: 140, cy: 500, length: 22, angle: 0, speed: 0.04},
    {cx: 400, cy: 1060, length: 20, angle: 0, speed: -0.05},
    {cx: 140, cy: 1300, length: 22, angle: 0, speed: 0.05}
];

function checkCollisionLine(px, py, radius, x1, y1, x2, y2) {
    let dx = x2 - x1;
    let dy = y2 - y1;
    let len = Math.sqrt(dx * dx + dy * dy);
    let u = ((px - x1) * dx + (py - y1) * dy) / (len * len);
    u = Math.max(0, Math.min(1, u));
    let ix = x1 + u * dx;
    let iy = y1 + u * dy;
    let dist = Math.sqrt((px - ix) * (px - ix) + (py - iy) * (py - iy));
    return dist < radius;
}

function checkCollisionRect(circleX, circleY, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(circleX, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circleY, rect.y + rect.h));
    let distanceX = circleX - closestX;
    let distanceY = circleY - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
}

function update() {
    if (gameState === 'PLAYING') {
        if (keys.ArrowUp) playerY -= PLAYER_SPEED;
        if (keys.ArrowDown) playerY += PLAYER_SPEED;
        if (keys.ArrowLeft) playerX -= PLAYER_SPEED;
        if (keys.ArrowRight) playerX += PLAYER_SPEED;

        // 壁判定
        for (let wall of walls) {
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, wall)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // 動く障害物判定
        for (let obs of movingObstacles) {
            if (obs.vx) {
                obs.x += obs.vx;
                if (obs.x < obs.minX || obs.x + obs.w > obs.maxX) obs.vx *= -1;
            }
            if (obs.vy) {
                obs.y += obs.vy;
                if (obs.y < obs.minY || obs.y + obs.h > obs.maxY) obs.vy *= -1;
            }
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, obs)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // プロペラ判定
        for (let sp of spinners) {
            sp.angle += sp.speed;
            let x2 = sp.cx + Math.cos(sp.angle) * sp.length;
            let y2 = sp.cy + Math.sin(sp.angle) * sp.length;
            let x1 = sp.cx - Math.cos(sp.angle) * sp.length;
            let y1 = sp.cy - Math.sin(sp.angle) * sp.length;

            if (checkCollisionLine(playerX, playerY, PLAYER_RADIUS, x1, y1, x2, y2)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // ゴール判定
        if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, goalZone)) {
            gameState = 'CLEAR';
        }
    }

    deathDisplay.textContent = deathCount;

    // 描画
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-playerX, -playerY);

    // スタート＆ゴール
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(startZone.x, startZone.y, startZone.w, startZone.h);

    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

    // 壁（赤）
    ctx.fillStyle = '#ff0055';
    walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

    // 移動障害物（黄）
    ctx.fillStyle = '#ffee00';
    movingObstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));

    // 回転プロペラ（黄）
    ctx.strokeStyle = '#ffee00';
    ctx.lineWidth = 2;
    spinners.forEach(sp => {
        ctx.beginPath();
        ctx.moveTo(sp.cx - Math.cos(sp.angle) * sp.length, sp.cy - Math.sin(sp.angle) * sp.length);
        ctx.lineTo(sp.cx + Math.cos(sp.angle) * sp.length, sp.cy + Math.sin(sp.angle) * sp.length);
        ctx.stroke();
    });

    // 自機（水色）
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // UIテキスト
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText('矢印キーを押してスタート', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(150, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('DEATH - 矢印キーでリトライ', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0, 200, 100, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CLEAR! 完全制覇おめでとう！', canvas.width / 2, canvas.height / 2);
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
