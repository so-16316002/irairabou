<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カメラ追跡型・1本道イライラ棒</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff0055;
            background-color: #050508;
            cursor: crosshair;
        }
        #info {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0055;
        }
    </style>
</head>
<body>

<div id="info">DEATHS: <span id="death-count">0</span></div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathDisplay = document.getElementById('death-count');

// --- パラメータ設定 ---
const EASING = 0.045;
const PLAYER_RADIUS = 3;

let mouseWorldX = 40, mouseWorldY = 40;
let playerX = 40, playerY = 40;
let cameraX = 0, cameraY = 0;
let deathCount = 0;

let gameState = 'START';

// スタート・ゴール位置（1本道の起点と終点）
const startZone = {x: 10, y: 10, w: 60, h: 60};
const goalZone = {x: 200, y: 1250, w: 60, h: 60};

// 一本道の外壁データ（分岐なし）
const walls = [
    // --- スタートエリア周り ---
    {x: 0, y: 0, w: 80, h: 10},
    {x: 0, y: 0, w: 10, h: 80},
    {x: 0, y: 70, w: 10, h: 10},

    // --- エリア1: 上部のイラスト再現（左右に進むコース） ---
    {x: 70, y: 70, w: 730, h: 10}, // 下壁
    {x: 70, y: 0, w: 740, h: 10},  // 上壁

    // 手書き再現の突起（上から）
    {x: 150, y: 10, w: 5, h: 40}, {x: 270, y: 10, w: 5, h: 45},
    {x: 390, y: 10, w: 5, h: 40}, {x: 510, y: 10, w: 5, h: 45},
    {x: 630, y: 10, w: 5, h: 40}, {x: 750, y: 10, w: 5, h: 45},

    // 手書き再現の突起（下から）
    {x: 210, y: 30, w: 5, h: 40}, {x: 330, y: 25, w: 5, h: 45},
    {x: 450, y: 30, w: 5, h: 40}, {x: 570, y: 25, w: 5, h: 45},
    {x: 690, y: 30, w: 5, h: 40},

    // --- エリア2: 右折して垂直落下（下に進むコース） ---
    {x: 800, y: 0, w: 10, h: 400},  // 右外壁
    {x: 730, y: 70, w: 10, h: 260}, // 左内壁

    // --- エリア3: 下部のクランク1本道（左に進むコース） ---
    {x: 100, y: 320, w: 640, h: 10}, // 上壁
    {x: 170, y: 390, w: 640, h: 10}, // 下壁

    // --- エリア4: 左折して垂直落下2（下に進むコース） ---
    {x: 100, y: 320, w: 10, h: 300}, // 左外壁
    {x: 170, y: 390, w: 10, h: 170}, // 右内壁

    // --- エリア5: 右に進むロングストレート ---
    {x: 100, y: 610, w: 700, h: 10}, // 下壁
    {x: 170, y: 550, w: 560, h: 10}, // 上壁

    // --- エリア6: 下に進むコース2 ---
    {x: 790, y: 610, w: 10, h: 300}, // 右外壁
    {x: 720, y: 550, w: 10, h: 300}, // 左内壁

    // --- エリア7: 左に進むラストスパート ---
    {x: 200, y: 900, w: 600, h: 10}, // 下壁
    {x: 260, y: 840, w: 470, h: 10}, // 上壁

    // --- エリア8: ゴール直前下降 ---
    {x: 200, y: 900, w: 10, h: 400}, // 左壁
    {x: 260, y: 840, w: 10, h: 400}, // 右壁
    {x: 200, y: 1300, w: 70, h: 10}  // 底壁
];

// 1本道の上に設置された移動障害物
const movingObstacles = [
    {x: 735, y: 120, w: 60, h: 8, vx: -2.5, vy: 0, minX: 735, maxX: 795},
    {x: 735, y: 220, w: 60, h: 8, vx: 2.5, vy: 0, minX: 735, maxX: 795},
    {x: 300, y: 325, w: 8, h: 60, vx: 0, vy: 2, minY: 325, maxY: 385},
    {x: 500, y: 325, w: 8, h: 60, vx: 0, vy: -2, minY: 325, maxY: 385},
    {x: 200, y: 560, w: 10, h: 45, vx: 4, vy: 0, minX: 180, maxX: 710},
    {x: 600, y: 560, w: 10, h: 45, vx: -4, vy: 0, minX: 180, maxX: 710},
    {x: 725, y: 700, w: 60, h: 10, vx: 0, vy: 3, minY: 615, maxY: 835},
    {x: 300, y: 845, w: 10, h: 50, vx: 3, vy: 0, minX: 265, maxX: 715}
];

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    let screenMouseX = e.clientX - rect.left;
    let screenMouseY = e.clientY - rect.top;
    
    // 画面上のマウス座標をワールド座標（マップ全体の位置）に変換
    mouseWorldX = screenMouseX + cameraX;
    mouseWorldY = screenMouseY + cameraY;
});

canvas.addEventListener('mousedown', () => {
    if (gameState === 'START') {
        if (mouseWorldX >= startZone.x && mouseWorldX <= startZone.x + startZone.w &&
            mouseWorldY >= startZone.y && mouseWorldY <= startZone.y + startZone.h) {
            gameState = 'PLAYING';
            playerX = startZone.x + startZone.w / 2;
            playerY = startZone.y + startZone.h / 2;
        }
    } else if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
        gameState = 'START';
        playerX = startZone.x + startZone.w / 2;
        playerY = startZone.y + startZone.h / 2;
        mouseWorldX = playerX;
        mouseWorldY = playerY;
    }
});

function checkCollisionRect(circleX, circleY, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(circleX, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circleY, rect.y + rect.h));
    let distanceX = circleX - closestX;
    let distanceY = circleY - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
}

function update() {
    if (gameState === 'PLAYING') {
        playerX += (mouseWorldX - playerX) * EASING;
        playerY += (mouseWorldY - playerY) * EASING;

        // 壁との当たり判定
        for (let wall of walls) {
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, wall)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // 移動障害物の更新・判定
        for (let obs of movingObstacles) {
            if (obs.vx) {
                obs.x += obs.vx;
                if (obs.x < obs.minX || obs.x + obs.w > obs.maxX) obs.vx *= -1;
            }
            if (obs.vy) {
                obs.y += obs.vy;
                if (obs.y < obs.minY || obs.y + obs.h > obs.maxY) obs.vy *= -1;
            }
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, obs)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // ゴール判定
        if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, goalZone)) {
            gameState = 'CLEAR';
        }
    }

    // カメラ位置を自機が画面中央に来るよう追従させる
    cameraX = playerX - canvas.width / 2;
    cameraY = playerY - canvas.height / 2;

    deathDisplay.textContent = deathCount;

    // --- 描画処理 ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // カメラの移動分だけ全体をオフセット描画
    ctx.translate(-cameraX, -cameraY);

    // スタート＆ゴール
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(startZone.x, startZone.y, startZone.w, startZone.h);

    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

    // 壁（赤）
    ctx.fillStyle = '#ff0055';
    walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

    // 移動障害物（赤紫）
    ctx.fillStyle = '#ff00aa';
    movingObstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));

    // 自機（緑）
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // UIオーバーレイメッセージ
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText('スタート枠をクリックして開始', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(150, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('DEATH - クリックして再挑戦', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0, 200, 100, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CLEAR! 完全制覇！', canvas.width / 2, canvas.height / 2);
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
