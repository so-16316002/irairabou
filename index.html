<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>難関・イライラ棒（11px調整版）</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff0055;
            background-color: #050508;
        }
        #info {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0055;
        }
    </style>
</head>
<body>

<div id="info">DEATHS: <span id="death-count">0</span> | [矢印キー] 移動</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathDisplay = document.getElementById('death-count');

// --- 基本設定 ---
const ZOOM = 2.4;            // ズーム倍率
const PLAYER_SPEED = 2.5;    // 移動速度
const PLAYER_RADIUS = 3.5;   // 自機サイズ（直径7px）

let playerX = 50, playerY = 50;
let deathCount = 0;
let gameState = 'START';

const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = true;
        if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'CLEAR') {
            resetGame();
            gameState = 'PLAYING';
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
});

function resetGame() {
    playerX = 50;
    playerY = 50;
}

// スタート・ゴール
const startZone = {x: 20, y: 20, w: 60, h: 60};
const goalZone = {x: 20, y: 1640, w: 80, h: 80};

// --- 外壁データ ---
const walls = [
    // スタート部屋
    {x: 10, y: 10, w: 80, h: 10},
    {x: 10, y: 10, w: 10, h: 80},
    {x: 10, y: 80, w: 80, h: 10},

    // エリア1: 通路幅70px（y:10〜y:80）
    {x: 80, y: 10, w: 710, h: 10},
    {x: 80, y: 80, w: 630, h: 10},

    // --- 上下からの突起（隙間を11pxに設定） ---
    // 上からの棒（下側に11pxの隙間を残す：長さ49px）
    {x: 160, y: 20, w: 6, h: 49}, 
    {x: 280, y: 20, w: 6, h: 49}, 
    {x: 400, y: 20, w: 6, h: 49}, 
    {x: 520, y: 20, w: 6, h: 49}, 
    {x: 640, y: 20, w: 6, h: 49},

    // 下からの棒（上側に11pxの隙間を残す：y=31から開始）
    {x: 220, y: 31, w: 6, h: 49}, 
    {x: 340, y: 31, w: 6, h: 49}, 
    {x: 460, y: 31, w: 6, h: 49}, 
    {x: 580, y: 31, w: 6, h: 49},

    // コーナー1（下へ）
    {x: 780, y: 10, w: 10, h: 250},
    {x: 700, y: 80, w: 10, h: 110},

    // コーナー2（左へ）
    {x: 200, y: 250, w: 590, h: 10},
    {x: 270, y: 180, w: 440, h: 10},

    // コーナー3（下へ）
    {x: 200, y: 250, w: 10, h: 300},
    {x: 270, y: 180, w: 10, h: 300},

    // コーナー4（右へ）
    {x: 200, y: 540, w: 500, h: 10},
    {x: 270, y: 470, w: 510, h: 10},

    // コーナー5（下へ）
    {x: 770, y: 470, w: 10, h: 350},
    {x: 690, y: 540, w: 10, h: 350},

    // コーナー6（左へ）
    {x: 100, y: 810, w: 600, h: 10},
    {x: 170, y: 880, w: 610, h: 10},

    // コーナー7（下〜ゴールへ）
    {x: 100, y: 810, w: 10, h: 850},
    {x: 170, y: 880, w: 10, h: 710},
    {x: 10, y: 1720, w: 170, h: 10},
    {x: 10, y: 1580, w: 10, h: 140},
    {x: 10, y: 1580, w: 100, h: 10}
];

// --- 動く障害物（徐々にスピードアップ） ---
const movingObstacles = [
    {x: 715, y: 110, w: 55, h: 8, baseSpeed: 1.2, dirX: 1, dirY: 0, minX: 715, maxX: 775, minY: 0, maxY: 0},
    {x: 300, y: 195, w: 8, h: 45, baseSpeed: 2.2, dirX: 0, dirY: 1, minX: 0, maxX: 0, minY: 195, maxY: 240},
    {x: 215, y: 300, w: 45, h: 8, baseSpeed: 2.5, dirX: 1, dirY: 0, minX: 215, maxX: 265, minY: 0, maxY: 0},
    {x: 350, y: 485, w: 8, h: 45, baseSpeed: 3.5, dirX: 0, dirY: 1, minX: 0, maxX: 0, minY: 485, maxY: 530},
    {x: 705, y: 600, w: 55, h: 8, baseSpeed: 3.8, dirX: 1, dirY: 0, minX: 705, maxX: 765, minY: 0, maxY: 0},
    {x: 300, y: 825, w: 10, h: 45, baseSpeed: 5.0, dirX: 0, dirY: 1, minX: 0, maxX: 0, minY: 825, maxY: 870},
    {x: 105, y: 1200, w: 55, h: 8, baseSpeed: 5.5, dirX: 1, dirY: 0, minX: 105, maxX: 165, minY: 0, maxY: 0}
];

function checkCollisionRect(circleX, circleY, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(circleX, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circleY, rect.y + rect.h));
    let distanceX = circleX - closestX;
    let distanceY = circleY - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
}

function update() {
    if (gameState === 'PLAYING') {
        if (keys.ArrowUp) playerY -= PLAYER_SPEED;
        if (keys.ArrowDown) playerY += PLAYER_SPEED;
        if (keys.ArrowLeft) playerX -= PLAYER_SPEED;
        if (keys.ArrowRight) playerX += PLAYER_SPEED;

        // 壁判定
        for (let wall of walls) {
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, wall)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // 動く障害物判定
        for (let obs of movingObstacles) {
            if (obs.dirX !== 0) {
                obs.x += obs.baseSpeed * obs.dirX;
                if (obs.x < obs.minX || obs.x + obs.w > obs.maxX) obs.dirX *= -1;
            }
            if (obs.dirY !== 0) {
                obs.y += obs.baseSpeed * obs.dirY;
                if (obs.y < obs.minY || obs.y + obs.h > obs.maxY) obs.dirY *= -1;
            }
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, obs)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // ゴール判定
        if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, goalZone)) {
            gameState = 'CLEAR';
        }
    }

    deathDisplay.textContent = deathCount;

    // 描画
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-playerX, -playerY);

    // スタート＆ゴール
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(startZone.x, startZone.y, startZone.w, startZone.h);

    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

    // 壁（赤）
    ctx.fillStyle = '#ff0055';
    walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

    // 移動障害物（黄）
    ctx.fillStyle = '#ffee00';
    movingObstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));

    // 自機（水色）
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // UIテキスト
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText('矢印キーを押してスタート', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(150, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('DEATH - 矢印キーでリトライ', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0, 200, 100, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CLEAR! 完全制覇おめでとう！', canvas.width / 2, canvas.height / 2);
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
