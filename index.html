<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>近距離カメラ・キーボード操作型イライラ棒</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff0055;
            background-color: #050508;
        }
        #info {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0055;
        }
    </style>
</head>
<body>

<div id="info">DEATHS: <span id="death-count">0</span> | [矢印キー] 移動</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathDisplay = document.getElementById('death-count');

// --- 設定パラメータ ---
const ZOOM = 2.2;           // カメラのズーム倍率（数値を大きくすると近く表示）
const PLAYER_SPEED = 2.8;   // プレイヤーの移動速度
const PLAYER_RADIUS = 3;    // 自機サイズ

let playerX = 40, playerY = 40;
let deathCount = 0;
let gameState = 'START';

// キー入力状態
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = true;
        if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'CLEAR') {
            resetGame();
            gameState = 'PLAYING';
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
});

function resetGame() {
    playerX = 40;
    playerY = 40;
}

// スタート・ゴール位置
const startZone = {x: 10, y: 10, w: 60, h: 60};
const goalZone = {x: 200, y: 1650, w: 60, h: 60};

// --- 分岐なし1本道の外壁 ---
const walls = [
    // スタート部屋
    {x: 0, y: 0, w: 80, h: 10}, {x: 0, y: 0, w: 10, h: 80}, {x: 0, y: 70, w: 10, h: 10},

    // 1. 手書きイラスト再現ゾーン（横移動）
    {x: 70, y: 0, w: 740, h: 10},
    {x: 70, y: 70, w: 730, h: 10},
    // 上下の固定突起
    {x: 150, y: 10, w: 5, h: 40}, {x: 270, y: 10, w: 5, h: 45}, {x: 390, y: 10, w: 5, h: 40}, {x: 510, y: 10, w: 5, h: 45},
    {x: 210, y: 30, w: 5, h: 40}, {x: 330, y: 25, w: 5, h: 45}, {x: 450, y: 30, w: 5, h: 40}, {x: 570, y: 25, w: 5, h: 45},

    // 2. 垂直落下 ＋ プレス機ゾーン
    {x: 800, y: 0, w: 10, h: 400},
    {x: 730, y: 70, w: 10, h: 260},

    // 3. クランク＆回転プロペラゾーン
    {x: 100, y: 320, w: 640, h: 10},
    {x: 170, y: 390, w: 640, h: 10},

    // 4. 左下降＆トゲ伸縮ゾーン
    {x: 100, y: 320, w: 10, h: 300},
    {x: 170, y: 390, w: 10, h: 170},

    // 5. ロングスライドバーゾーン（右移動）
    {x: 100, y: 610, w: 700, h: 10},
    {x: 170, y: 550, w: 560, h: 10},

    // 6. 下降ギミック密集ゾーン
    {x: 790, y: 610, w: 10, h: 400},
    {x: 720, y: 550, w: 10, h: 400},

    // 7. 高速往復バーゾーン（左移動）
    {x: 200, y: 1000, w: 600, h: 10},
    {x: 260, y: 940, w: 470, h: 10},

    // 8. ラストスパート（ゴール前下降）
    {x: 200, y: 1000, w: 10, h: 710},
    {x: 260, y: 940, w: 10, h: 710},
    {x: 200, y: 1710, w: 70, h: 10}
];

// --- 移動・伸縮・スライド障害物 ---
const movingObstacles = [
    // 垂直落下の往復壁
    {x: 735, y: 120, w: 60, h: 8, vx: -2.0, vy: 0, minX: 735, maxX: 795},
    {x: 735, y: 220, w: 60, h: 8, vx: 2.0, vy: 0, minX: 735, maxX: 795},

    // ロングストレートの縦スライドバー
    {x: 200, y: 560, w: 12, h: 45, vx: 3.5, vy: 0, minX: 180, maxX: 710},
    {x: 600, y: 560, w: 12, h: 45, vx: -3.5, vy: 0, minX: 180, maxX: 710},

    // 下降ゾーンのプレスブロック
    {x: 725, y: 700, w: 60, h: 12, vx: 0, vy: 3, minY: 615, maxY: 935},

    // ラスト前の高速スライド壁
    {x: 300, y: 945, w: 10, h: 50, vx: 4, vy: 0, minX: 265, maxX: 715},
    {x: 500, y: 945, w: 10, h: 50, vx: -4, vy: 0, minX: 265, maxX: 715},

    // ゴール手前の押しつぶしトラップ
    {x: 205, y: 1200, w: 50, h: 10, vx: 0, vy: 2, minY: 1100, maxY: 1300},
    {x: 205, y: 1450, w: 50, h: 10, vx: 0, vy: -2, minY: 1350, maxY: 1550}
];

// --- 回転プロペラ障害物 ---
const spinners = [
    {cx: 450, cy: 355, length: 28, angle: 0, speed: 0.05},
    {cx: 250, cy: 355, length: 28, angle: 0, speed: -0.06},
    {cx: 135, cy: 480, length: 28, angle: 0, speed: 0.07},
    {cx: 230, cy: 1600, length: 24, angle: 0, speed: 0.08}
];

function checkCollisionLine(px, py, radius, x1, y1, x2, y2) {
    let dx = x2 - x1;
    let dy = y2 - y1;
    let len = Math.sqrt(dx * dx + dy * dy);
    let u = ((px - x1) * dx + (py - y1) * dy) / (len * len);
    u = Math.max(0, Math.min(1, u));
    let ix = x1 + u * dx;
    let iy = y1 + u * dy;
    let dist = Math.sqrt((px - ix) * (px - ix) + (py - iy) * (py - iy));
    return dist < radius;
}

function checkCollisionRect(circleX, circleY, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(circleX, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circleY, rect.y + rect.h));
    let distanceX = circleX - closestX;
    let distanceY = circleY - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
}

function update() {
    if (gameState === 'PLAYING') {
        // キーボード移動処理
        if (keys.ArrowUp) playerY -= PLAYER_SPEED;
        if (keys.ArrowDown) playerY += PLAYER_SPEED;
        if (keys.ArrowLeft) playerX -= PLAYER_SPEED;
        if (keys.ArrowRight) playerX += PLAYER_SPEED;

        // 壁との当たり判定
        for (let wall of walls) {
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, wall)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // 移動障害物の更新・判定
        for (let obs of movingObstacles) {
            if (obs.vx) {
                obs.x += obs.vx;
                if (obs.x < obs.minX || obs.x + obs.w > obs.maxX) obs.vx *= -1;
            }
            if (obs.vy) {
                obs.y += obs.vy;
                if (obs.y < obs.minY || obs.y + obs.h > obs.maxY) obs.vy *= -1;
            }
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, obs)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // 回転プロペラ判定
        for (let sp of spinners) {
            sp.angle += sp.speed;
            let x2 = sp.cx + Math.cos(sp.angle) * sp.length;
            let y2 = sp.cy + Math.sin(sp.angle) * sp.length;
            let x1 = sp.cx - Math.cos(sp.angle) * sp.length;
            let y1 = sp.cy - Math.sin(sp.angle) * sp.length;

            if (checkCollisionLine(playerX, playerY, PLAYER_RADIUS, x1, y1, x2, y2)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // ゴール判定
        if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, goalZone)) {
            gameState = 'CLEAR';
        }
    }

    deathDisplay.textContent = deathCount;

    // --- 描画（近距離ズームカメラ） ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    // 画面中央に自機が来るようカメラを原点に移動し、ズーム倍率を適用
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-playerX, -playerY);

    // スタート＆ゴール
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(startZone.x, startZone.y, startZone.w, startZone.h);

    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

    // 壁（赤）
    ctx.fillStyle = '#ff0055';
    walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

    // 移動障害物（黄）
    ctx.fillStyle = '#ffee00';
    movingObstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));

    // 回転プロペラ（黄）
    ctx.strokeStyle = '#ffee00';
    ctx.lineWidth = 2;
    spinners.forEach(sp => {
        ctx.beginPath();
        ctx.moveTo(sp.cx - Math.cos(sp.angle) * sp.length, sp.cy - Math.sin(sp.angle) * sp.length);
        ctx.lineTo(sp.cx + Math.cos(sp.angle) * sp.length, sp.cy + Math.sin(sp.angle) * sp.length);
        ctx.stroke();
    });

    // 自機（水色）
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // UIオーバーレイメッセージ
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText('矢印キーを押してスタート', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(150, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('DEATH - 矢印キーでリトライ', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0, 200, 100, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CLEAR! 完全制覇おめでとう！', canvas.width / 2, canvas.height / 2);
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
