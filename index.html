<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>激難アクションゲーム</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
        }
        canvas {
            background-color: #eee;
            border: 4px solid #fff;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <h1>激難アクションゲーム</h1>
    <p>矢印キーまたはWASDキーで操作して、青い玉を避けて緑のゾーンを目指そう！</p>
    <p>ミス回数: <span id="deathCount">0</span></p>

    <canvas id="gameCanvas" width="600" height="300"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const deathCountElement = document.getElementById("deathCount");

        let deaths = 0;

        // プレイヤーオブジェクト
        const player = {
            x: 50,
            y: 135,
            size: 20,
            speed: 3
        };

        // スタートとゴールの領域
        const startZone = { x: 0, y: 0, width: 100, height: 300 };
        const goalZone = { x: 500, y: 0, width: 100, height: 300 };

        // 障害物（青い玉）の配列
        const enemies = [
            { x: 150, y: 20, radius: 10, speedY: 4 },
            { x: 220, y: 280, radius: 10, speedY: -4 },
            { x: 290, y: 20, radius: 10, speedY: 5 },
            { x: 360, y: 280, radius: 10, speedY: -5 },
            { x: 430, y: 20, radius: 10, speedY: 6 }
        ];

        // キー入力の状態管理
        const keys = {};

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        // リセット処理
        function resetPlayer() {
            player.x = 50;
            player.y = 135;
        }

        // 更新処理
        function update() {
            // 移動処理
            if ((keys["ArrowUp"] || keys["w"]) && player.y > 0) player.y -= player.speed;
            if ((keys["ArrowDown"] || keys["s"]) && player.y + player.size < canvas.height) player.y += player.speed;
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || keys["d"]) && player.x + player.size < canvas.width) player.x += player.speed;

            // 障害物の移動と壁反射
            enemies.forEach(enemy => {
                enemy.y += enemy.speedY;
                if (enemy.y - enemy.radius < 0 || enemy.y + enemy.radius > canvas.height) {
                    enemy.speedY *= -1;
                }

                // 衝突判定（四角形と円）
                const closestX = Math.max(player.x, Math.min(player.x + player.size, enemy.x));
                const closestY = Math.max(player.y, Math.min(player.y + player.size, enemy.y));
                const distanceX = enemy.x - closestX;
                const distanceY = enemy.y - closestY;
                const distance = Math.sqrt((distanceX * distanceX) + (distanceY * distanceY));

                if (distance < enemy.radius) {
                    deaths++;
                    deathCountElement.textContent = deaths;
                    resetPlayer();
                }
            });

            // ゴール判定
            if (player.x + player.size > goalZone.x) {
                alert(`クリアおめでとうございます！\nミス回数: ${deaths} 回`);
                deaths = 0;
                deathCountElement.textContent = deaths;
                resetPlayer();
            }
        }

        // 描画処理
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 安全地帯（スタート）
            ctx.fillStyle = "#a8ffb2";
            ctx.fillRect(startZone.x, startZone.y, startZone.width, startZone.height);

            // ゴール地帯
            ctx.fillStyle = "#a8ffb2";
            ctx.fillRect(goalZone.x, goalZone.y, goalZone.width, goalZone.height);

            // プレイヤー描画
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.strokeStyle = "#000";
            ctx.strokeRect(player.x, player.y, player.size, player.size);

            // 障害物描画
            enemies.forEach(enemy => {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#0066ff";
                ctx.fill();
                ctx.strokeStyle = "#000";
                ctx.stroke();
                ctx.closePath();
            });
        }

        // ゲームループ
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
