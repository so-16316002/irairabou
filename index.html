<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精密イライラ棒 - 手書きコース再現</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff0055;
            background-color: #050508;
            cursor: crosshair;
        }
        #info {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0055;
        }
    </style>
</head>
<body>

<div id="info">DEATHS: <span id="death-count">0</span></div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathDisplay = document.getElementById('death-count');

// --- パラメータ設定 ---
const EASING = 0.045;       // 強い慣性（滑る操作感）
const PLAYER_RADIUS = 2.5;  // 自機サイズ

let mouseX = 40, mouseY = 40;
let playerX = 40, playerY = 40;
let deathCount = 0;

let gameState = 'START';

// スタート・ゴール
const startZone = {x: 15, y: 15, w: 50, h: 50};
const goalZone = {x: 720, y: 520, w: 50, h: 50};

// イラスト再現コース（上下から交互に突き出る壁）
const walls = [
    // 外枠
    {x: 0, y: 0, w: 800, h: 10},
    {x: 0, y: 590, w: 800, h: 10},
    {x: 0, y: 0, w: 10, h: 600},
    {x: 790, y: 0, w: 10, h: 600},

    // --- メインコースの外壁（手書きの長い通路と右折） ---
    // 上側の外壁
    {x: 10, y: 10, w: 770, h: 5},
    // 下側の外壁（スタート直後から右折まで）
    {x: 10, y: 65, w: 715, h: 5},
    // 右折したあとの右外壁
    {x: 775, y: 10, w: 5, h: 580},
    // 右折したあとの内側外壁
    {x: 720, y: 65, w: 5, h: 460},

    // --- 上下から交互に突き出る仕切り（イラスト再現部分） ---
    // 上から下へ突き出る突起（奇数）
    {x: 100, y: 15, w: 4, h: 32},
    {x: 180, y: 15, w: 4, h: 35},
    {x: 260, y: 15, w: 4, h: 32},
    {x: 340, y: 15, w: 4, h: 38},
    {x: 420, y: 15, w: 4, h: 30},
    {x: 500, y: 15, w: 4, h: 35},
    {x: 580, y: 15, w: 4, h: 32},
    {x: 660, y: 15, w: 4, h: 36},

    // 下から上へ突き出る突起（偶数）
    {x: 140, y: 33, w: 4, h: 32},
    {x: 220, y: 30, w: 4, h: 35},
    {x: 300, y: 33, w: 4, h: 32},
    {x: 380, y: 28, w: 4, h: 37},
    {x: 460, y: 35, w: 4, h: 30},
    {x: 540, y: 30, w: 4, h: 35},
    {x: 620, y: 33, w: 4, h: 32},
    {x: 700, y: 28, w: 4, h: 37},

    // --- 右折後の縦コース仕切り（左右交互） ---
    {x: 725, y: 120, w: 32, h: 4},
    {x: 743, y: 180, w: 32, h: 4},
    {x: 725, y: 240, w: 32, h: 4},
    {x: 743, y: 300, w: 32, h: 4},
    {x: 725, y: 360, w: 32, h: 4},
    {x: 743, y: 420, w: 32, h: 4},
    {x: 725, y: 480, w: 32, h: 4}
];

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', () => {
    if (gameState === 'START') {
        if (mouseX >= startZone.x && mouseX <= startZone.x + startZone.w &&
            mouseY >= startZone.y && mouseY <= startZone.y + startZone.h) {
            gameState = 'PLAYING';
            playerX = startZone.x + startZone.w / 2;
            playerY = startZone.y + startZone.h / 2;
        }
    } else if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
        gameState = 'START';
        playerX = startZone.x + startZone.w / 2;
        playerY = startZone.y + startZone.h / 2;
    }
});

function checkCollisionRect(circleX, circleY, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(circleX, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circleY, rect.y + rect.h));
    let distanceX = circleX - closestX;
    let distanceY = circleY - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
}

function update() {
    if (gameState === 'PLAYING') {
        playerX += (mouseX - playerX) * EASING;
        playerY += (mouseY - playerY) * EASING;

        // 壁との当たり判定
        for (let wall of walls) {
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, wall)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // ゴール判定
        if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, goalZone)) {
            gameState = 'CLEAR';
        }
    }

    deathDisplay.textContent = deathCount;

    // 描画
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // スタート＆ゴール
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(startZone.x, startZone.y, startZone.w, startZone.h);

    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

    // 壁（赤）
    ctx.fillStyle = '#ff0055';
    walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

    // 自機（緑）
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // UIテキスト
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText('スタート枠をクリック', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(150, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('DEATH - クリックでやり直し', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0, 200, 100, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CLEAR! お見事！', canvas.width / 2, canvas.height / 2);
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
