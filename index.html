<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極狭・超難関イライラ棒</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #555;
            background-color: #080810;
            cursor: crosshair;
        }
        #info {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ff4444;
        }
    </style>
</head>
<body>

<div id="info">DEATHS: <span id="death-count">0</span></div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathDisplay = document.getElementById('death-count');

// --- 超難易度調整パラメータ ---
const EASING = 0.08;        // 慣性を強力に（急に止まれない）
const PLAYER_RADIUS = 3;    // 自機は小さく、でも通路はもっと狭い

let mouseX = 50, mouseY = 50;
let playerX = 50, playerY = 50;
let deathCount = 0;

let gameState = 'START';

// スタート・ゴール
const startZone = {x: 25, y: 25, w: 50, h: 50};
const goalZone = {x: 725, y: 525, w: 50, h: 50};

// 極狭コース設計（通路幅12〜15px程度）
const walls = [
    // 外枠
    {x: 0, y: 0, w: 800, h: 10},
    {x: 0, y: 590, w: 800, h: 10},
    {x: 0, y: 0, w: 10, h: 600},
    {x: 790, y: 0, w: 10, h: 600},

    // 区画1: スタート直後の超狭直線
    {x: 10, y: 85, w: 700, h: 15},
    {x: 85, y: 10, w: 15, h: 50},

    // 区画2: 折り返し＆クランク（隙間15px）
    {x: 85, y: 115, w: 705, h: 15},
    {x: 10, y: 145, w: 715, h: 15},

    // 区画3: ジグザグの刺客
    {x: 150, y: 160, w: 15, h: 180},
    {x: 230, y: 200, w: 15, h: 180},
    {x: 310, y: 160, w: 15, h: 180},
    {x: 390, y: 200, w: 15, h: 180},
    {x: 470, y: 160, w: 15, h: 180},

    {x: 10, y: 390, w: 700, h: 15},

    // 区画4: 終盤の螺旋・迷路
    {x: 780, y: 160, w: 10, h: 300},
    {x: 10, y: 460, w: 700, h: 15},
    {x: 710, y: 460, w: 15, h: 130},
    {x: 630, y: 510, w: 15, h: 80},
    {x: 550, y: 475, w: 15, h: 85}
];

// 高速・狭範囲で動く障害物
const movingObstacles = [
    {x: 400, y: 100, w: 12, h: 15, vx: 6, minX: 100, maxX: 700},
    {x: 200, y: 130, w: 12, h: 15, vx: -7, minX: 20, maxX: 700},
    {x: 270, y: 220, w: 25, h: 12, vy: 5, minY: 200, maxY: 370},
    {x: 430, y: 220, w: 25, h: 12, vy: -5, minY: 200, maxY: 370},
    {x: 10, y: 425, w: 80, h: 12, vx: 8, minX: 10, maxX: 700},
    {x: 600, y: 440, w: 80, h: 12, vx: -9, minX: 10, maxX: 700}
];

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', () => {
    if (gameState === 'START') {
        if (mouseX >= startZone.x && mouseX <= startZone.x + startZone.w &&
            mouseY >= startZone.y && mouseY <= startZone.y + startZone.h) {
            gameState = 'PLAYING';
            playerX = startZone.x + startZone.w / 2;
            playerY = startZone.y + startZone.h / 2;
        }
    } else if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
        gameState = 'START';
        playerX = startZone.x + startZone.w / 2;
        playerY = startZone.y + startZone.h / 2;
    }
});

function checkCollision(circleX, circleY, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(circleX, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circleY, rect.y + rect.h));
    let distanceX = circleX - closestX;
    let distanceY = circleY - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
}

function update() {
    if (gameState === 'PLAYING') {
        // マウスへの遅れ（慣性）を強く適用
        playerX += (mouseX - playerX) * EASING;
        playerY += (mouseY - playerY) * EASING;

        // 障害物の更新
        movingObstacles.forEach(obs => {
            if (obs.vy) {
                obs.y += obs.vy;
                if (obs.y < obs.minY || obs.y + obs.h > obs.maxY) obs.vy *= -1;
            }
            if (obs.vx) {
                obs.x += obs.vx;
                if (obs.x < obs.minX || obs.x + obs.w > obs.maxX) obs.vx *= -1;
            }

            if (checkCollision(playerX, playerY, PLAYER_RADIUS, obs)) {
                gameState = 'GAMEOVER';
                deathCount++;
            }
        });

        // 壁判定
        for (let wall of walls) {
            if (checkCollision(playerX, playerY, PLAYER_RADIUS, wall)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // ゴール判定
        if (checkCollision(playerX, playerY, PLAYER_RADIUS, goalZone)) {
            gameState = 'CLEAR';
        }
    }

    deathDisplay.textContent = deathCount;

    // 描画
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // スタート＆ゴール
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(startZone.x, startZone.y, startZone.w, startZone.h);

    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

    // 危険な赤壁
    ctx.fillStyle = '#ff2244';
    walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

    // 動く障害物（黄）
    ctx.fillStyle = '#ffee00';
    movingObstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));

    // プレイヤー（自機）
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    // オーバーレイ
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText('緑の枠内をクリックしてスタート', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(180, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('DEATH - クリックでやり直し', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0, 180, 100, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CLEAR! 神回！', canvas.width / 2, canvas.height / 2);
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
