<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オートラン・イライラ棒</title>
    <style>
        body {
            background-color: #05050a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff0055;
            background-color: #050508;
        }
        #info {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #ff0055;
        }
    </style>
</head>
<body>

<div id="info">DEATHS: <span id="death-count">0</span> | [↑/↓ キー] 上下移動</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const deathDisplay = document.getElementById('death-count');

// --- 基本設定 ---
const ZOOM = 2.0;
const AUTO_SPEED_X = 2.2;   // 自動で右に進む速度
const PLAYER_SPEED_Y = 2.8; // 上下移動のスピード
const PLAYER_RADIUS = 3.5;  // 自機サイズ

let playerX = 50, playerY = 45;
let deathCount = 0;
let gameState = 'START';

const keys = { ArrowUp: false, ArrowDown: false };

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        keys[e.key] = true;
        if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'CLEAR') {
            resetGame();
            gameState = 'PLAYING';
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
});

function resetGame() {
    playerX = 50;
    playerY = 45;
}

// スタート・ゴールエリア
const startZone = {x: 20, y: 20, w: 60, h: 50};
const goalZone = {x: 2400, y: 20, w: 60, h: 50};

// --- 自動前進コース（前方の壁を避ける構造） ---
const walls = [
    // 上下の外枠壁
    {x: 0, y: 10, w: 2500, h: 10},
    {x: 0, y: 80, w: 2500, h: 10},
    {x: 0, y: 10, w: 10, h: 80},

    // --- 前方に立ちはだかる壁（上下の隙間を抜ける） ---
    // 前方の壁 1（下が開いている）
    {x: 300, y: 20, w: 15, h: 45}, 
    // 前方の壁 2（上が開いている）
    {x: 500, y: 35, w: 15, h: 45}, 
    // 前方の壁 3（中央の隙間11pxを抜ける）
    {x: 700, y: 20, w: 15, h: 22},
    {x: 700, y: 53, w: 15, h: 27},

    // 前方の壁 4（下が開いている）
    {x: 950, y: 20, w: 15, h: 48},
    // 前方の壁 5（上が開いている）
    {x: 1200, y: 32, w: 15, h: 48},

    // 連続クランク壁
    {x: 1450, y: 20, w: 15, h: 45},
    {x: 1650, y: 35, w: 15, h: 45},
    {x: 1850, y: 20, w: 15, h: 45},

    // ラスボス手前の極小隙間（11px）
    {x: 2100, y: 20, w: 20, h: 25},
    {x: 2100, y: 56, w: 20, h: 24}
];

// --- 動く障害物（上下に動いて前方を塞ぐ） ---
const movingObstacles = [
    {x: 400, y: 20, w: 10, h: 30, speed: 0.8, dir: 1, minY: 20, maxY: 50},
    {x: 820, y: 30, w: 10, h: 30, speed: 1.2, dir: -1, minY: 20, maxY: 50},
    {x: 1080, y: 20, w: 12, h: 25, speed: 1.5, dir: 1, minY: 20, maxY: 55},
    {x: 1350, y: 35, w: 12, h: 25, speed: 1.8, dir: -1, minY: 20, maxY: 55},
    {x: 1950, y: 20, w: 15, h: 25, speed: 2.2, dir: 1, minY: 20, maxY: 55}
];

function checkCollisionRect(circleX, circleY, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(circleX, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(circleY, rect.y + rect.h));
    let distanceX = circleX - closestX;
    let distanceY = circleY - closestY;
    return (distanceX * distanceX + distanceY * distanceY) < (radius * radius);
}

function update() {
    if (gameState === 'PLAYING') {
        // 自動で右へ前進
        playerX += AUTO_SPEED_X;

        // プレイヤーの上下操作
        if (keys.ArrowUp) playerY -= PLAYER_SPEED_Y;
        if (keys.ArrowDown) playerY += PLAYER_SPEED_Y;

        // 壁（前方の壁含む）との衝突判定
        for (let wall of walls) {
            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, wall)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // 移動障害物との衝突判定
        for (let obs of movingObstacles) {
            obs.y += obs.speed * obs.dir;
            if (obs.y < obs.minY || obs.y + obs.h > obs.maxY + obs.h) obs.dir *= -1;

            if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, obs)) {
                gameState = 'GAMEOVER';
                deathCount++;
                break;
            }
        }

        // ゴール判定
        if (checkCollisionRect(playerX, playerY, PLAYER_RADIUS, goalZone)) {
            gameState = 'CLEAR';
        }
    }

    deathDisplay.textContent = deathCount;

    // 描画
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-playerX, -playerY);

    // スタート＆ゴール
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(startZone.x, startZone.y, startZone.w, startZone.h);

    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(goalZone.x, goalZone.y, goalZone.w, goalZone.h);

    // 壁（赤）
    ctx.fillStyle = '#ff0055';
    walls.forEach(wall => ctx.fillRect(wall.x, wall.y, wall.w, wall.h));

    // 移動障害物（黄）
    ctx.fillStyle = '#ffee00';
    movingObstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.w, obs.h));

    // 自機（水色）
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(playerX, playerY, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // UIテキスト
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px sans-serif';
    ctx.textAlign = 'center';

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc';
        ctx.fillText('↑ または ↓ キーを押してスタート！', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(150, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CRASH! キーを押してリトライ', canvas.width / 2, canvas.height / 2);
    } else if (gameState === 'CLEAR') {
        ctx.fillStyle = 'rgba(0, 200, 100, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('CLEAR! おめでとう！', canvas.width / 2, canvas.height / 2);
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
