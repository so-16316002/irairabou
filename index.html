<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>激難アクション - 拡大版</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
        }
        canvas {
            background-color: #222;
            border: 4px solid #fff;
            display: block;
            margin: 10px auto;
        }
        .info {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>激難アクション - 拡大版</h1>
    <p>青い弾を避けて緑のゴールを目指せ！</p>
    <div class="info">
        STAGE: <span id="stageNum">1</span> / 3 | 
        ミス回数: <span id="deathCount">0</span>
    </div>

    <canvas id="gameCanvas" width="500" height="250"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const deathCountElement = document.getElementById("deathCount");
        const stageNumElement = document.getElementById("stageNum");

        let deaths = 0;
        let currentStage = 1;
        let frameCount = 0;

        // プレイヤー（10px -> 16pxに拡大）
        const player = {
            x: 15,
            y: 117,
            size: 16,
            speed: 3.5
        };

        // 安全地帯・ゴール領域
        let startZone = { x: 0, y: 0, width: 50, height: 250 };
        let goalZone = { x: 450, y: 0, width: 50, height: 250 };

        let enemies = [];

        // キー入力の状態管理
        const keys = {};

        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function clearKeys() {
            for (let key in keys) {
                keys[key] = false;
            }
        }

        window.addEventListener("blur", clearKeys);

        // ステージ構造の設定
        function loadStage(stage) {
            clearKeys();

            currentStage = stage;
            stageNumElement.textContent = currentStage;
            player.x = 15;
            player.y = 117;
            enemies = [];

            if (stage === 1) {
                // STAGE 1: 横一列密接＆全域カバー（半径12px / 直径24pxに拡大）
                const radius = 12;
                const startX = 65;
                const endX = 435;
                const step = radius * 2; // 密接配置 (24px間隔)

                let count = 0;
                for (let x = startX; x <= endX; x += step) {
                    enemies.push({
                        x: x,
                        y: (count % 2 === 0) ? radius : canvas.height - radius,
                        radius: radius,
                        speedX: 0,
                        speedY: (count % 2 === 0) ? 6 : -6,
                        type: "bounce"
                    });
                    count++;
                }
            } else if (stage === 2) {
                // STAGE 2: 旋回＋縦横交差（ボール拡大版）
                const centerX = 250, centerY = 125, radius = 70;
                for (let i = 0; i < 10; i++) {
                    const angle = (Math.PI * 2 / 10) * i;
                    enemies.push({
                        cx: centerX, cy: centerY, r: radius, angle: angle,
                        x: centerX + Math.cos(angle) * radius,
                        y: centerY + Math.sin(angle) * radius,
                        radius: 12, speedAngle: 0.08, type: "rotate"
                    });
                }

                enemies.push({ x: 50, y: 30, radius: 16, speedX: 7, speedY: 0, minX: 50, maxX: 450, type: "bounceRange" });
                enemies.push({ x: 450, y: 220, radius: 16, speedX: -7, speedY: 0, minX: 50, maxX: 450, type: "bounceRange" });
            } else if (stage === 3) {
                // STAGE 3: 弾幕地獄（ボール拡大版）
                const radius = 10;
                for (let x = 70; x <= 430; x += 35) {
                    enemies.push({
                        x: x,
                        y: (x % 20 === 0) ? radius : canvas.height - radius,
                        radius: radius,
                        speedX: 0,
                        speedY: (x % 20 === 0) ? 8 : -8,
                        type: "bounce"
                    });
                }
            }
        }

        function update() {
            frameCount++;

            // 移動操作
            if ((keys["ArrowUp"] || keys["w"]) && player.y > 0) player.y -= player.speed;
            if ((keys["ArrowDown"] || keys["s"]) && player.y + player.size < canvas.height) player.y += player.speed;
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || keys["d"]) && player.x + player.size < canvas.width) player.x += player.speed;

            // STAGE 3 動的弾幕
            if (currentStage === 3) {
                if (frameCount % 25 === 0) {
                    const bulletCount = 10;
                    for (let i = 0; i < bulletCount; i++) {
                        const angle = (Math.PI * 2 / bulletCount) * i + (frameCount * 0.1);
                        enemies.push({
                            x: 250, y: 125,
                            vx: Math.cos(angle) * 3.5,
                            vy: Math.sin(angle) * 3.5,
                            radius: 6,
                            type: "bullet"
                        });
                    }
                }

                if (frameCount % 15 === 0) {
                    enemies.push({
                        x: 60 + Math.random() * 380, y: 0,
                        vx: (Math.random() - 0.5) * 2, vy: 4 + Math.random() * 2,
                        radius: 6, type: "bullet"
                    });
                    enemies.push({
                        x: 60 + Math.random() * 380, y: 250,
                        vx: (Math.random() - 0.5) * 2, vy: -(4 + Math.random() * 2),
                        radius: 6, type: "bullet"
                    });
                }
            }

            // 障害物の処理
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];

                if (enemy.type === "bounce") {
                    enemy.y += enemy.speedY;
                    if (enemy.y - enemy.radius <= 0 || enemy.y + enemy.radius >= canvas.height) {
                        enemy.speedY *= -1;
                    }
                } else if (enemy.type === "rotate") {
                    enemy.angle += enemy.speedAngle;
                    enemy.x = enemy.cx + Math.cos(enemy.angle) * enemy.r;
                    enemy.y = enemy.cy + Math.sin(enemy.angle) * enemy.r;
                } else if (enemy.type === "bounceRange") {
                    enemy.x += enemy.speedX;
                    if (enemy.x - enemy.radius < enemy.minX || enemy.x + enemy.radius > enemy.maxX) {
                        enemy.speedX *= -1;
                    }
                } else if (enemy.type === "bullet") {
                    enemy.x += enemy.vx;
                    enemy.y += enemy.vy;
                    if (enemy.x < 0 || enemy.x > canvas.width || enemy.y < 0 || enemy.y > canvas.height) {
                        enemies.splice(i, 1);
                        continue;
                    }
                }

                // 衝突判定
                const closestX = Math.max(player.x, Math.min(player.x + player.size, enemy.x));
                const closestY = Math.max(player.y, Math.min(player.y + player.size, enemy.y));
                if (Math.hypot(enemy.x - closestX, enemy.y - closestY) < enemy.radius) {
                    deaths++;
                    deathCountElement.textContent = deaths;
                    loadStage(currentStage);
                    return;
                }
            }

            // ゴール判定
            if (player.x + player.size > goalZone.x && 
                player.x < goalZone.x + goalZone.width &&
                player.y + player.size > goalZone.y && 
                player.y < goalZone.y + goalZone.height) {
                
                if (currentStage < 3) {
                    alert(`STAGE ${currentStage} クリア！ 次のステージへ進みます。`);
                    loadStage(currentStage + 1);
                } else {
                    alert(`全ステージクリア！おめでとうございます！\n総ミス回数: ${deaths} 回`);
                    deaths = 0;
                    deathCountElement.textContent = deaths;
                    loadStage(1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景
            const tileSize = 25;
            for (let r = 0; r < canvas.height / tileSize; r++) {
                for (let c = 0; c < canvas.width / tileSize; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? "#262626" : "#1e1e1e";
                    ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                }
            }

            // スタート＆ゴールエリア
            ctx.fillStyle = "#55ff55";
            ctx.fillRect(startZone.x, startZone.y, startZone.width, startZone.height);
            ctx.fillRect(goalZone.x, goalZone.y, goalZone.width, goalZone.height);

            // STAGE 3 中央砲台
            if (currentStage === 3) {
                ctx.beginPath();
                ctx.arc(250, 125, 15, 0, Math.PI * 2);
                ctx.fillStyle = "#ff0055";
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.stroke();
            }

            // プレイヤー描画
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.strokeRect(player.x, player.y, player.size, player.size);

            // 障害物描画
            enemies.forEach(enemy => {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fillStyle = enemy.type === "bullet" ? "#00ffff" : "#0066ff";
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loadStage(1);
        loop();
    </script>
</body>
</html>
