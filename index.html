<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>激難アクション - STAGE2ボール数半減版</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
        }
        canvas {
            background-color: #222;
            border: 4px solid #fff;
            display: block;
            margin: 10px auto;
        }
        .info {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        #startScreen {
            margin: 20px auto;
            padding: 20px;
            background-color: #222;
            width: 460px;
            border: 2px solid #fff;
        }
        .btn {
            font-size: 1.2rem;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 5px;
        }
        .easy { background-color: #28a745; }
        .normal { background-color: #007bff; }
        .hard { background-color: #dc3545; }
        .btn-quit {
            background-color: #6c757d;
            font-size: 0.9rem;
            padding: 5px 12px;
            margin-left: 15px;
            border: 1px solid #fff;
        }
        .btn:hover, .btn-quit:hover { opacity: 0.8; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>激難アクション</h1>

    <!-- スタート画面 -->
    <div id="startScreen">
        <h2>難易度を選択してください</h2>
        <button class="btn easy" onclick="startGame('easy')">簡単</button>
        <button class="btn normal" onclick="startGame('normal')">普通</button>
        <button class="btn hard" onclick="startGame('hard')">難しい</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="gameContainer" class="hidden">
        <div class="info">
            難易度: <span id="diffText">-</span> | 
            STAGE: <span id="stageNum">1</span> / 3 | 
            ミス回数: <span id="deathCount">0</span>
            <button class="btn btn-quit" onclick="returnToTitle()">タイトルへ戻る</button>
        </div>

        <canvas id="gameCanvas" width="512" height="256"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const deathCountElement = document.getElementById("deathCount");
        const stageNumElement = document.getElementById("stageNum");
        const diffTextElement = document.getElementById("diffText");
        const startScreen = document.getElementById("startScreen");
        const gameContainer = document.getElementById("gameContainer");

        let deaths = 0;
        let currentStage = 1;
        let frameCount = 0;
        let currentDifficulty = "normal";
        let isGameRunning = false;

        const TILE_SIZE_EASY = 16;

        const player = {
            x: 16,
            y: 120,
            size: 16,
            speed: 3.5
        };

        let startZone = { x: 0, y: 0, width: 64, height: 256 };
        let goalZone = { x: 448, y: 0, width: 64, height: 256 };

        let enemies = [];

        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function clearKeys() {
            for (let key in keys) {
                keys[key] = false;
            }
        }
        window.addEventListener("blur", clearKeys);

        function startGame(difficulty) {
            currentDifficulty = difficulty;
            let diffName = "普通";
            if (difficulty === "easy") diffName = "簡単";
            if (difficulty === "hard") diffName = "難しい";
            
            diffTextElement.textContent = diffName;
            startScreen.classList.add("hidden");
            gameContainer.classList.remove("hidden");

            deaths = 0;
            deathCountElement.textContent = deaths;
            isGameRunning = true;

            loadStage(1);
            loop();
        }

        function returnToTitle() {
            if (confirm("タイトル画面に戻りますか？\n（現在の進行状況はリセットされます）")) {
                isGameRunning = false;
                clearKeys();
                gameContainer.classList.add("hidden");
                startScreen.classList.remove("hidden");
            }
        }

        function loadStage(stage) {
            clearKeys();

            currentStage = stage;
            stageNumElement.textContent = currentStage;
            enemies = [];

            let pSize = 12;
            let speedMult = 1.0;

            if (currentDifficulty === "easy") {
                pSize = 16;
                speedMult = 0.7;
            } else if (currentDifficulty === "normal") {
                pSize = 12;
                speedMult = 1.0;
            } else if (currentDifficulty === "hard") {
                pSize = 12;
                speedMult = 1.35;
            }

            player.size = pSize;
            player.x = 24;
            player.y = (canvas.height / 2) - (player.size / 2);

            if (stage === 1) {
                const ballRadius = 8;
                const ballSize = ballRadius * 2;
                const startX = 80;
                const endX = 432;
                const step = (currentDifficulty === "easy") ? ballSize * 2 : ballSize + 8;

                let count = 0;
                for (let x = startX; x <= endX; x += step) {
                    enemies.push({
                        x: x + ballRadius,
                        y: (count % 2 === 0) ? ballRadius : canvas.height - ballRadius,
                        radius: ballRadius,
                        speedX: 0,
                        speedY: ((count % 2 === 0) ? 4 : -4) * (currentDifficulty === "hard" ? 1.5 : 1.0),
                        type: "bounce"
                    });
                    count++;
                }
            } else if (stage === 2) {
                let stage2Radius = 8;
                const centerX = 256, centerY = 128;

                // 各層のボール数を半分に調整（12➔6, 9➔4, 6➔3）
                const layers = [
                    { r: 112, count: 6, speed: 0.035 * speedMult },
                    { r: 80,  count: 4, speed: -0.05 * speedMult },
                    { r: 48,  count: 3, speed: 0.07 * speedMult }
                ];

                layers.forEach(layer => {
                    for (let i = 0; i < layer.count; i++) {
                        const angle = (Math.PI * 2 / layer.count) * i;
                        enemies.push({
                            cx: centerX, 
                            cy: centerY, 
                            r: layer.r, 
                            angle: angle,
                            x: centerX + Math.cos(angle) * layer.r,
                            y: centerY + Math.sin(angle) * layer.r,
                            radius: stage2Radius, 
                            speedAngle: layer.speed, 
                            type: "rotate"
                        });
                    }
                });
            } else if (stage === 3) {
                const ballRadius = 8;
                for (let x = 80; x <= 432; x += 32) {
                    enemies.push({
                        x: x + ballRadius,
                        y: (x % 64 === 0) ? ballRadius : canvas.height - ballRadius,
                        radius: ballRadius,
                        speedX: 0,
                        speedY: (x % 64 === 0) ? 6 : -6,
                        type: "bounce"
                    });
                }
            }
        }

        function update() {
            if (!isGameRunning) return;

            frameCount++;

            if ((keys["ArrowUp"] || keys["w"]) && player.y > 0) player.y -= player.speed;
            if ((keys["ArrowDown"] || keys["s"]) && player.y + player.size < canvas.height) player.y += player.speed;
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || keys["d"]) && player.x + player.size < canvas.width) player.x += player.speed;

            if (currentStage === 3) {
                if (frameCount % 25 === 0) {
                    const bulletCount = 10;
                    for (let i = 0; i < bulletCount; i++) {
                        const angle = (Math.PI * 2 / bulletCount) * i + (frameCount * 0.1);
                        enemies.push({
                            x: 256, y: 128,
                            vx: Math.cos(angle) * 3.5,
                            vy: Math.sin(angle) * 3.5,
                            radius: 5,
                            type: "bullet"
                        });
                    }
                }

                if (frameCount % 15 === 0) {
                    enemies.push({
                        x: 64 + Math.random() * 384, y: 0,
                        vx: (Math.random() - 0.5) * 2, vy: 4 + Math.random() * 2,
                        radius: 5, type: "bullet"
                    });
                    enemies.push({
                        x: 64 + Math.random() * 384, y: 256,
                        vx: (Math.random() - 0.5) * 2, vy: -(4 + Math.random() * 2),
                        radius: 5, type: "bullet"
                    });
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];

                if (enemy.type === "bounce") {
                    enemy.y += enemy.speedY;
                    if (enemy.y - enemy.radius <= 0 || enemy.y + enemy.radius >= canvas.height) {
                        enemy.speedY *= -1;
                    }
                } else if (enemy.type === "rotate") {
                    enemy.angle += enemy.speedAngle;
                    enemy.x = enemy.cx + Math.cos(enemy.angle) * enemy.r;
                    enemy.y = enemy.cy + Math.sin(enemy.angle) * enemy.r;
                } else if (enemy.type === "bullet") {
                    enemy.x += enemy.vx;
                    enemy.y += enemy.vy;
                    if (enemy.x < 0 || enemy.x > canvas.width || enemy.y < 0 || enemy.y > canvas.height) {
                        enemies.splice(i, 1);
                        continue;
                    }
                }

                const closestX = Math.max(player.x, Math.min(player.x + player.size, enemy.x));
                const closestY = Math.max(player.y, Math.min(player.y + player.size, enemy.y));
                if (Math.hypot(enemy.x - closestX, enemy.y - closestY) < enemy.radius) {
                    deaths++;
                    deathCountElement.textContent = deaths;
                    loadStage(currentStage);
                    return;
                }
            }

            if (player.x + player.size > goalZone.x && 
                player.x < goalZone.x + goalZone.width &&
                player.y + player.size > goalZone.y && 
                player.y < goalZone.y + goalZone.height) {
                
                if (currentStage < 3) {
                    alert(`STAGE ${currentStage} クリア！ 次のステージへ進みます。`);
                    loadStage(currentStage + 1);
                } else {
                    alert(`全ステージクリア！おめでとうございます！\n総ミス回数: ${deaths} 回`);
                    isGameRunning = false;
                    gameContainer.classList.add("hidden");
                    startScreen.classList.remove("hidden");
                }
            }
        }

        function draw() {
            if (!isGameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const tileSize = (currentDifficulty === "easy") ? TILE_SIZE_EASY : 25; 

            for (let r = 0; r < Math.ceil(canvas.height / tileSize); r++) {
                for (let c = 0; c < Math.ceil(canvas.width / tileSize); c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? "#2d2d2d" : "#1a1a1a";
                    ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                }
            }

            ctx.fillStyle = "#55ff55";
            ctx.fillRect(startZone.x, startZone.y, startZone.width, startZone.height);
            ctx.fillRect(goalZone.x, goalZone.y, goalZone.width, goalZone.height);

            if (currentStage === 3) {
                ctx.beginPath();
                ctx.arc(256, 128, 16, 0, Math.PI * 2);
                ctx.fillStyle = "#ff0055";
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.stroke();
            }

            ctx.fillStyle = "#ff3333";
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.strokeRect(player.x, player.y, player.size, player.size);

            enemies.forEach(enemy => {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fillStyle = enemy.type === "bullet" ? "#00ffff" : "#0066ff";
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }

        function loop() {
            if (isGameRunning) {
                update();
                draw();
                requestAnimationFrame(loop);
            }
        }
    </script>
</body>
</html>
